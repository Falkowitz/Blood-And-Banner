# Units
unit.bnb-dead.name = Dead Bat.
unit.bnb-dead-man.name = Dead Man
unit.bnb-dead-man-horse.name = Dead Man W Horse
unit.bnb-unit-king.name = King

unit.bnb-unit-militiamen.name = Militia Bat.
unit.bnb-unit-militiamen.description = Basic militia consisting of medieval levies with minimal equipment. Effective for mass containment in early stages and guarding secondary routes. Their main advantage is their low cost.
unit.bnb-unit-swordsmen.name = Sword Bat.
unit.bnb-unit-swordsmen.description = Regular infantry armed with swords and light armor. They possess balanced attack and defense stats, making them versatile close-combat fighters. 
unit.bnb-unit-spearmen.name = Spear Bat.
unit.bnb-unit-spearmen.description = Units trained to counter cavalry charges. Long spears allow them to deal significant damage to mounted units and hold the front line. 
unit.bnb-unit-shieldmen.name = Shield Bat.
unit.bnb-unit-shieldmen.description = Heavily armored soldiers specializing in protecting allies from ranged fire. Large shields provide high survival under a hail of arrows and projectiles. 
unit.bnb-unit-bowmen.name = Bow Bat.
unit.bnb-unit-bowmen.description = Ranged units providing fire support from a safe distance. They handle unarmored targets well but are vulnerable in close combat. Most effective when firing from behind friendly lines.
unit.bnb-unit-cavalrymen.name = L. Cavalry Bat.
unit.bnb-unit-cavalrymen.description = Highly mobile light cavalry units designed for scouting and lightning-fast attacks. Excellent for pursuing retreating forces.
unit.bnb-unit-cuirassiers.name = H. Cavalry Bat.
unit.bnb-unit-cuirassiers.description = Elite heavy cavalry protected by powerful cuirasses. Their devastating charge can break through enemy ranks.
unit.bnb-unit-lancers.name = S. Cavalry Bat.
unit.bnb-unit-lancers.description = Specialized cavalry armed with lances. They combine high speed with increased attack range, allowing them to deal high shock damage to enemy units, but suffer in close combat.

unit.bnb-unit-attack-colonel.name = Attack Col.
unit.bnb-unit-attack-colonel.description = A seasoned officer focused on aggressive tactics and breaking through defenses. Increases the offensive potential and attack speed of nearby units.
unit.bnb-unit-defence-colonel.name = Defence Col.
unit.bnb-unit-defence-colonel.description = A tactical commander specializing in holding positions and minimizing losses. Enhances the resilience and armor of nearby troops.
unit.bnb-unit-maneuver-colonel.name = Maneuver Col.
unit.bnb-unit-maneuver-colonel.description = A master of operational planning and rapid movement. Increases troop mobility and discipline in motion.
unit.bnb-unit-universal-colonel.name = Universal Col.
unit.bnb-unit-universal-colonel.description = A versatile leader with a wide range of tactical skills. Provides balanced bonuses to all key characteristics of the army.

unit.bnb-unit-siege-catapult.name = Mangonel
unit.bnb-unit-siege-catapult.description = A heavy siege engine designed to destroy fortifications and dense enemy clusters. Massive boulders deal colossal area damage. Has a low fire rate and accuracy, but immense range.
unit.bnb-unit-siege-ballista.name = Ballista
unit.bnb-unit-siege-ballista.description = A precise long-range weapon effective against large single targets. Powerful bolts can pierce even the strongest armor and shields. Ideal for eliminating threats from a distance.
unit.bnb-unit-ship-galley.name = Galley
unit.bnb-unit-ship-galley.description = A multi-oared warship providing control over coastal waters. Capable of providing fire support to ground troops and effectively fighting other ships.
unit.bnb-unit-fire-bowmen.name = F. Bowmen Bat.
unit.bnb-unit-fire-bowmen.description = Archers using incendiary projectiles to create fire hazards. Well-suited for destroying wooden structures and demoralizing the enemy. Inflicts additional fire damage over time.
unit.bnb-unit-musketmen.name = Musket Bat.
unit.bnb-unit-musketmen.description = Soldiers of a new era armed with firearms. Musket bullets ignore most types of traditional armor. Possess immense stopping power but require time to reload and infantry protection.

